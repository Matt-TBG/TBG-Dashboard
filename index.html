<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tierra Bella Gardens - Control Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>Tierra Bella Gardens</h1>
        <p>Operations Control Center</p>
    </div>

    <!-- MAIN HIGH LEVEL NAVIGATION TABS -->
    <div class="tabs-container">
        <button class="tab-link active" onclick="openMainTab(event, 'summary')">Overview</button>
        <button class="tab-link" onclick="openMainTab(event, 'projects')">Projects <span id="count-projects" class="badge">0</span></button>
        <button class="tab-link" onclick="openMainTab(event, 'walkthrough')">Walk Throughs <span id="count-walkthrough" class="badge">0</span></button>
        <button class="tab-link" onclick="openMainTab(event, 'shopping')">Shopping Lists <span id="count-shopping" class="badge">0</span></button>
    </div>

    <div class="dashboard-container">
        
        <!-- 1. OVERVIEW VIEW PANEL -->
        <div id="summary" class="tab-content default-active">
            <div class="tab-header-block">
                <h2>Operational Alert Stream</h2>
                <p>Prioritized items requiring immediate attention:</p>
            </div>
            
            <!-- Quick Add form inside the Overview tab itself -->
            <div class="inline-form">
                <h4>Quick Logging Entry</h4>
                <div class="form-row">
                    <div class="combobox-wrapper">
                        <input type="text" id="overview-prop" class="combo-input" placeholder="Select property..." onclick="toggleCombo(this)" oninput="filterCombo(this)">
                        <button class="combo-arrow" onclick="arrowToggleCombo(this, event)">▼</button>
                        <div class="combo-dropdown"></div>
                    </div>
                    <input type="text" id="overview-text" placeholder="General alert/to-do detail description...">
                    <button class="action-btn" onclick="addCustomItem('overview', 'overview-prop', 'overview-text')">Log Alert</button>
                </div>
            </div>
            <div id="urgent-stream-container"></div>
        </div>

        <!-- 2. PROJECTS TAB PANEL (WITH SUB-CATEGORIES) -->
        <div id="projects" class="tab-content">
            <div class="sub-tabs-bar">
                <button class="sub-tab-link active" onclick="openSubTab(event, 'projects', 'proj-oneoff')">One-Off</button>
                <button class="sub-tab-link" onclick="openSubTab(event, 'projects', 'proj-current')">Current</button>
                <button class="sub-tab-link" onclick="openSubTab(event, 'projects', 'proj-upcoming')">Upcoming</button>
                <button class="sub-tab-link" onclick="openSubTab(event, 'projects', 'proj-major')">Major</button>
            </div>

            <!-- Contextual Form for Projects Tab -->
            <div class="inline-form">
                <h4>Add Project Entry</h4>
                <div class="form-row">
                    <div class="combobox-wrapper">
                        <input type="text" id="project-prop" class="combo-input" placeholder="Select property..." onclick="toggleCombo(this)" oninput="filterCombo(this)">
                        <button class="combo-arrow" onclick="arrowToggleCombo(this, event)">▼</button>
                        <div class="combo-dropdown"></div>
                    </div>
                    <input type="text" id="project-text" placeholder="Project tasks, notes, or descriptions...">
                    <button class="action-btn" onclick="addContextualItem('projects', 'project-prop', 'project-text')">Add Project</button>
                </div>
            </div>

            <div id="proj-oneoff" class="sub-tab-content default-sub-active"><div id="proj-oneoff-container"></div></div>
            <div id="proj-current" class="sub-tab-content"><div id="proj-current-container"></div></div>
            <div id="proj-upcoming" class="sub-tab-content"><div id="proj-upcoming-container"></div></div>
            <div id="proj-major" class="sub-tab-content"><div id="proj-major-container"></div></div>
        </div>

        <!-- 3. WALK THROUGH PANELS -->
        <div id="walkthrough" class="tab-content">
            <div class="tab-header-block">
                <h2>Manager Walk-Through Worksheets</h2>
                <p>Property operational tasks synced with operations logs:</p>
            </div>
            <div class="inline-form">
                <h4>Add Inspection Note</h4>
                <div class="form-row">
                    <div class="combobox-wrapper">
                        <input type="text" id="walk-prop" class="combo-input" placeholder="Select property..." onclick="toggleCombo(this)" oninput="filterCombo(this)">
                        <button class="combo-arrow" onclick="arrowToggleCombo(this, event)">▼</button>
                        <div class="combo-dropdown"></div>
                    </div>
                    <input type="text" id="walk-text" placeholder="Walk-through instruction details...">
                    <button class="action-btn" onclick="addCustomItem('walkthrough', 'walk-prop', 'walk-text')">Record Walk</button>
                </div>
            </div>
            <div id="walkthrough-container"></div>
        </div>

        <!-- 4. SHOPPING TAB PANEL (WITH SUB-CATEGORIES) -->
        <div id="shopping" class="tab-content">
            <div class="sub-tabs-bar">
                <button class="sub-tab-link active" onclick="openSubTab(event, 'shopping', 'shop-crew')">Crew List</button>
                <button class="sub-tab-link" onclick="openSubTab(event, 'shopping', 'shop-steph')">Steph's List</button>
            </div>

            <div class="inline-form">
                <h4>Add Procurement Demand</h4>
                <div class="form-row">
                    <div class="combobox-wrapper">
                        <input type="text" id="shop-prop" class="combo-input" placeholder="Select property reference..." onclick="toggleCombo(this)" oninput="filterCombo(this)">
                        <button class="combo-arrow" onclick="arrowToggleCombo(this, event)">▼</button>
                        <div class="combo-dropdown"></div>
                    </div>
                    <input type="text" id="shop-text" placeholder="Items, sizes, quantities, or materials...">
                    <button class="action-btn" onclick="addContextualItem('shopping', 'shop-prop', 'shop-text')">Add to List</button>
                </div>
            </div>

            <div id="shop-crew" class="sub-tab-content default-sub-active"><div id="shop-crew-container"></div></div>
            <div id="shop-steph" class="sub-tab-content"><div id="shop-steph-container"></div></div>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
