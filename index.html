<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tierra Bella Gardens - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>Tierra Bella Gardens</h1>
        <p>Dashboard Control</p>
    </div>

    <!-- NEW ITEM INPUT BAR -->
    <div class="input-bar">
        <input type="text" id="property-input" placeholder="Property Name (e.g. Beard, Oreck)">
        <input type="text" id="task-input" placeholder="Details/Description...">
        <select id="column-select">
            <option value="todo">Property To-Do's</option>
            <option value="updates">Property Updates</option>
            <option value="shopping">Shopping List</option>
        </select>
        <button onclick="addItem()">Add Item</button>
    </div>

    <div class="dashboard-container">
        
        <!-- TO-DO COLUMN -->
        <div class="column column-todo">
            <h2>Property To-Do's</h2>
            <div id="todo-container"></div>
        </div>

        <!-- UPDATES COLUMN -->
        <div class="column column-updates">
            <h2>Property Updates</h2>
            <div id="updates-container"></div>
        </div>

        <!-- SHOPPING LIST COLUMN -->
        <div class="column column-shopping">
            <h2>Shopping List</h2>
            <div id="shopping-container"></div>
        </div>

    </div>

    <!-- LINK TO JAVASCRIPT LOGIC FILE -->
    <script src="app.js"></script>
</body>
</html>
